        <h1 style="font-size: 1.8rem;">KI Kobold — KI-Chat komplett offline im Browser</h1>
        <p><strong>Kostenlos, ohne Anmeldung, ohne Cloud:</strong> KI Kobold lädt kleine Sprachmodelle direkt auf dein Gerät — die Inferenz läuft 100 % lokal im Browser. Keine Nachricht verlässt deinen Rechner, es gibt kein Konto und keine Telemetrie.</p>
        <ul>
          <li><strong>6 kuratierte Modelle</strong> (LFM 2.5, Qwen 3, Gemma) — von 210 MB bis 1 GB, mit Empfehlung für dein Gerät</li>
          <li><strong>Bildgenerierung</strong> mit LCM DreamShaper</li>
          <li><strong>Offline-fähig:</strong> nach dem Modell-Download funktioniert alles ohne Internet (PWA)</li>
          <li><strong>Barrierefreiheit:</strong> Textgröße, hoher Kontrast, Lesbarkeits-Modus, Screenreader-Unterstützung</li>
          <li><strong>Datenschutz:</strong> Open Source (MIT), Chats bleiben lokal in deinem Browser</li>
        </ul>
        <p>Bitte <strong>JavaScript aktivieren</strong>, um die App zu nutzen — Chrome oder Edge bieten die schnellste Geschwindigkeit (WebGPU). Safari und Firefox nutzen automatisch den langsameren WASM-Modus.</p>
        <p><a href="https://github.com/5loxq/kikobold" style="color:#a78bfa;">Quellcode auf GitHub</a></p>
